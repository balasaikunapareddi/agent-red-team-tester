[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-red-team-tester"
version = "0.1.0"
description = "AutoGen multi-agent red team that attacks other agents — prompt injection, jailbreaks, authority impersonation, data-exfiltration probes — and scores whether the target held its rules. Mock-first: deterministic target, no API key, no network."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Bala Sai Kunapareddi" }]
dependencies = [
    "autogen-agentchat>=0.4",
    "autogen-ext[openai]>=0.4",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
red-team-demo = "agent_red_team_tester.demo:main"
red-team-report = "agent_red_team_tester.report:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
